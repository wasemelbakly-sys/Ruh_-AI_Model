{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block main_dashboard_content %}

<style>
    /* --- Dashboard Specific Styles --- */
    .dash-header {
        margin-bottom: 30px;
        padding-top: 20px;
    }
    .dash-title {
        font-size: 2rem;
        font-weight: 800;
        color: #0F172A;
        margin: 0 0 5px;
    }
    .dash-subtitle {
        color: #64748B;
        font-size: 1rem;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: 0.2s;
        position: relative;
        overflow: hidden;
        text-decoration: none; /* Important for <a> tags */
        color: inherit;
    }
    
    .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border-color: #CBD5E1;
    }
    
    .stat-info h3 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0;
        color: #0F172A;
        line-height: 1.2;
    }
    .stat-info p {
        margin: 5px 0 0;
        color: #64748B;
        font-size: 0.85rem;
        font-weight: 500;
    }

    .stat-icon {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
    }

    /* Map Section */
    .map-section {
        background: white;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        padding: 6px; 
        height: 500px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        position: relative; /* Ensure map stays inside */
        z-index: 1;
    }
    #homepage-map {
        width: 100%;
        height: 100%;
        border-radius: 16px;
    }
    
    /* Search Dropdown */
    #search-results-container {
        background: white; border: 1px solid #E2E8F0;
        border-radius: 12px; padding: 10px;
        position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
        width: 50%; z-index: 100; display: none;
        box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }
    .search-item { padding: 12px; border-bottom: 1px solid #F1F5F9; cursor: pointer; color: #334155; }
    .search-item:hover { background: #F8FAFC; color: var(--primary); }
</style>



<div class="stats-grid">
    
    <div class="stat-card">
        <div class="stat-info">
            <h3>Active</h3>
            <p>System Status</p>
        </div>
        <div class="stat-icon" style="background: #DCFCE7; color: #16A34A;">🟢</div>
    </div>
    
    <div class="stat-card">
        <div class="stat-info">
            <h3 id="weather-value">--°C</h3>
            <p>Current Weather</p>
        </div>
        <div class="stat-icon" style="background: #FFF7ED; color: #EA580C;">☀️</div>
    </div>

    <a href="{{ url_for('near') }}" class="stat-card">
        <div class="stat-info">
            <h3>Discover</h3>
            <p>New Places Nearby</p>
        </div>
        <div class="stat-icon" style="background: #EFF6FF; color: #3B82F6;">📍</div>
        <div style="position:absolute; right:10px; top:10px; font-size:0.8rem; color:#ccc;">↗</div>
    </a>

    <a href="{{ url_for('trend') }}" class="stat-card">
        <div class="stat-info">
            <h3>Top 10</h3>
            <p>Weekly Trends</p>
        </div>
        <div class="stat-icon" style="background: #FAF5FF; color: #9333EA;">🔥</div>
        <div style="position:absolute; right:10px; top:10px; font-size:0.8rem; color:#ccc;">↗</div>
    </a>
</div>

<div class="map-section">
    <div id="homepage-map"></div>
</div>

<div id="search-results-container"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    let map;
    const RIYADH = [24.7136, 46.6753];

    function initMap() {
        map = L.map('homepage-map', {zoomControl: false}).setView(RIYADH, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        L.control.zoom({position: 'bottomright'}).addTo(map);
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    map.setView([lat, lon], 15);
                    L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
                    L.circle([lat, lon], {radius: 800, color: '#4F46E5', fillOpacity: 0.1}).addTo(map);
                    getRealWeather(lat, lon);
                },
                () => { getRealWeather(RIYADH[0], RIYADH[1]); }
            );
        } else {
            getRealWeather(RIYADH[0], RIYADH[1]);
        }
    }

    async function getRealWeather(lat, lon) {
        try {
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const data = await response.json();
            if(data.current_weather) {
                const temp = Math.round(data.current_weather.temperature);
                document.getElementById('weather-value').innerText = `${temp}°C`;
            }
        } catch (error) { console.error("Weather error:", error); }
    }

    document.addEventListener('DOMContentLoaded', initMap);
    
    const searchInput = document.getElementById('searchInput'); 
    const resultsBox = document.getElementById('search-results-container');
    if(searchInput) {
        searchInput.addEventListener('input', (e) => {
            if(e.target.value.length > 0) {
                resultsBox.style.display = 'block';
                resultsBox.innerHTML = `<div class="search-item">🔍 Search for "<b>${e.target.value}</b>"</div>`;
            } else resultsBox.style.display = 'none';
        });
    }
</script>

{% endblock %}
