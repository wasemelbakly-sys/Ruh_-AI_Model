<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruh - {% block title %}{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="dashboard-layout">
        
        <aside class="sidebar">
            <div class="logo-area">
                <i class="fas fa-layer-group" style="color: var(--primary);"></i>
                <span style="color: #0F172A;">Ruh</span>
            </div>
            
            <nav class="main-nav">
               <a href="{{ url_for('go') }}" class="nav-item {% if active_page == 'home' %}active{% endif %}">
                    <span class="nav-icon"></span> <span>Home</span>
               </a>
    
               <a href="{{ url_for('mood') }}" class="nav-item {% if active_page == 'mood' %}active{% endif %}">
                    <span class="nav-icon"></span> <span>Mood</span>
               </a>
    
               <a href="{{ url_for('near') }}" class="nav-item {% if active_page == 'near' %}active{% endif %}">
                    <span class="nav-icon"></span> <span>Near</span>
               </a>
    
               <a href="{{ url_for('trend') }}" class="nav-item {% if active_page == 'trend' %}active{% endif %}">
                    <span class="nav-icon"></span> <span>Trends</span>
               </a>

               <a href="{{ url_for('history') }}" class="nav-item {% if active_page == 'history' %}active{% endif %}">
                 <span class="nav-icon"></span> <span>History</span>
               </a>
    
               <a href="{{ url_for('favorites') }}" class="nav-item {% if active_page == 'favorites' %}active{% endif %}">
                 <span class="nav-icon"></span> <span>Favorites</span>
               </a>
           </nav>
        </aside>

        <main class="main-content">
            
            <header class="header">
                <div class="search-bar-ui">
                    <i class="fas fa-search search-icon" style="color: #94A3B8;"></i>
                    <input type="text" id="searchInput" placeholder="Search locations, categories..." class="header-search-input">
                </div>
                
                <div class="user-actions">
                    <a href="#" class="action-icon" title="Notifications">
                        <i class="far fa-bell"></i>
                    </a>
                    
                    <a href="{{ url_for('profile') }}" class="action-icon user-profile" title="My Profile">
                        <i class="far fa-user"></i>
                    </a>

                    <a href="{{ url_for('logout') }}" class="action-icon" title="Sign Out" style="color: #EF4444; border-color: #FEE2E2; background-color: #FEF2F2;">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </header>

            <div class="main-page-wrapper">
                {% block main_dashboard_content %}
                {% endblock main_dashboard_content %}
            </div>
            
            <footer class="footer">
                <div class="footer-links">
                    <a href="{{ url_for('about') }}">About Ruh</a>
                    <a href="#">Help Center</a>
                    <a href="#">Privacy Policy</a>
                </div>
                <p>&copy; 2025 Ruh Intelligence. All rights reserved.</p>
            </footer>
        </main>
    </div>

</body>
</html>
